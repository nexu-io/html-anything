<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenMotion · Magnetic field</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 960px; height: 540px; overflow: hidden; }
    #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #cbd5c9; color: #141416; font-family: "Helvetica Neue", Arial, sans-serif; }
    .clip { position: absolute; inset: 0; }
#field { display:grid; place-items:center; }
#word { display:grid; place-items:center; font-size:50px; font-weight:780; letter-spacing:-2.8px; }
#film { background:radial-gradient(ellipse at 38% 45%, #d5dcd0, #bdcabc); }
#grain { opacity:.12; mix-blend-mode:multiply; }
  </style>
</head>
<body>
  <main id="film" data-composition-id="main" data-start="0" data-width="960" data-height="540" data-duration="5" data-fps="24">
    <div class="clip" id="field" data-start="0" data-duration="5" data-track-index="0"><svg viewBox="0 0 960 540" width="960" height="540"><g transform="translate(480 270)"><g id="lines" fill="none" stroke="#37473b" stroke-width="1.8"></g><defs><radialGradient id="pole"><stop stop-color="#142725"/><stop offset=".37" stop-color="#243b38"/><stop offset=".77" stop-color="#6c837c"/><stop offset="1" stop-color="#c3d0c4"/></radialGradient></defs><circle r="42" fill="#c3cfc3" stroke="#34483b" stroke-width="2"/><circle r="35" fill="url(#pole)" stroke="#65796e" stroke-width="1.5"/></g></svg></div>
    <div class="clip" id="word" data-start="0" data-duration="5" data-track-index="1"><span id="letters">OpenMotion</span></div>
    <div class="clip" id="grain" data-start="0" data-duration="5" data-track-index="2"><svg width="960" height="540"><filter id="paper"><feTurbulence baseFrequency=".53" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" opacity=".65" filter="url(#paper)"/></svg></div>
  </main>
  <script>
    const timeline = gsap.timeline({paused: true});
// The field has a closed lobe and an open fan in each quadrant.
const lines = document.querySelector('#lines');
const curves = [];
for (const reach of [71,96,125,166,218,265]) {
  const height = reach*.33;
  curves.push('M 40 -12 C '+(reach*.55+18)+' '+(-height)+' '+(reach-10)+' '+(-height*1.48)+' '+reach+' -4');
}
const tips = [[244,-104],[248,-173],[185,-216],[99,-213],[56,-194],[0,-188]];
tips.forEach(([x,y],i) => {
  const theta=(i+1)/6;
  curves.push('M '+(40-36*theta)+' '+(-18-27*theta)+' Q '+(x*.55)+' '+(y*.90)+' '+x+' '+y);
});
for (const side of [-1,1]) {
  for (const vertical of [-1,1]) {
    curves.forEach((d,index) => {
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',d);
      path.setAttribute('transform','scale('+side+','+vertical+')');
      lines.appendChild(path);
      if(index%2===0) {
        const point = path.getPointAtLength(path.getTotalLength()*(.37+index*.018));
        const speck=document.createElementNS('http://www.w3.org/2000/svg','circle');
        speck.setAttribute('cx',side*point.x);
        speck.setAttribute('cy',vertical*point.y);
        speck.setAttribute('r','2.2');
        speck.setAttribute('fill','#34453a');
        lines.appendChild(speck);
      }
    });
  }
}
timeline.fromTo('#lines',{scaleX:.89,scaleY:.92,transformOrigin:'50% 50%'},{scaleX:1.05,scaleY:1.05,duration:1.46,ease:'sine.inOut'},0);
timeline.to('#field',{opacity:0,duration:.35},1.4);
timeline.set('#word',{opacity:0},0);
timeline.to('#word',{opacity:1,duration:.21},1.75);
const letters = document.querySelector('#letters');
const variants = ['OpenMotion','O//M','O✳M','O/M//','O·MOTION','OPENMOTION'];
variants.forEach((text,index) => {
  timeline.set(letters,{textContent:text,fontFamily:index<2?'Georgia,serif':'Arial,sans-serif',fontStyle:index<2?'italic':'normal',fontWeight:index<2?400:760},1.76+index*.44);
});
    timeline.set({}, {}, 5);
    window.__timelines = {main: timeline};
  </script>
</body>
</html>

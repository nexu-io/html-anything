<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenMotion · In the cut</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 720px; height: 720px; overflow: hidden; }
    #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #eff6f7; color: #141416; font-family: "Helvetica Neue", Arial, sans-serif; }
    .clip { position: absolute; inset: 0; }
#film { background:linear-gradient(151deg,#cde8ee 0%,#e8f2f3 53%,#f8f7f8 100%); }
#copy { display:grid; place-items:center; text-align:center; font-weight:530; letter-spacing:-.065em; }
#fold { display:grid; place-items:center; }
#paper { width:570px;height:250px;position:relative; }
.band { position:absolute;inset:0;display:grid;place-items:center;font:550 252px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:-14px; color:#111820; }
  </style>
</head>
<body>
  <main id="film" data-composition-id="main" data-start="0" data-width="720" data-height="720" data-duration="5" data-fps="24">
    <div class="clip" id="copy" data-start="0" data-duration="5" data-track-index="0"><span id="word">There’s</span></div>
    <div class="clip" id="fold" data-start="0" data-duration="5" data-track-index="1"><div id="paper"></div></div>
  </main>
  <script>
    const timeline = gsap.timeline({paused: true});
// A word turns into a folded plane. Each slice remains editable text.
const paper = document.querySelector('#paper');
const strips = 110;
for (let i=0; i<strips; i++) {
  const band=document.createElement('span');
  band.className='band'; band.textContent='CUT';
  band.style.clipPath='inset('+ (i*100/strips)+'% 0 '+((strips-i-1)*100/strips-.12)+'% 0)';
  paper.appendChild(band);
}
const words = [{time:0,text:'There’s',size:55},{time:.54,text:'something',size:79},{time:1.82,text:'in',size:94},{time:2.03,text:'the',size:119}];
words.forEach(({time,text,size},index) => {
  timeline.set('#word',{textContent:text,fontSize:size,opacity:index?0:1},time);
  if(index) timeline.to('#word',{opacity:1,duration:.12},time);
  timeline.to('#word',{opacity:0,duration:.12},[.4,1.58,1.95,2.25][index]);
});
timeline.set('#fold',{opacity:0},0);
timeline.set('#fold',{opacity:1},2.32);
[...paper.children].forEach((band,i) => {
  const level=(i+.5)/strips;
  const fold=Math.exp(-Math.pow((level-.53)/.071,2));
  const shade=Math.round(35+96*fold);
  timeline.to(band,{x:fold*59-(level-.5)*38,scaleX:1.015,color:'rgb('+Math.round(shade*.15)+','+shade+','+(shade+43)+')',duration:.49,ease:'power2.inOut'},3.02);
});
    timeline.set({}, {}, 5);
    window.__timelines = {main: timeline};
  </script>
</body>
</html>

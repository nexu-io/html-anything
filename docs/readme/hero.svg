<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="332" viewBox="0 0 1176 332" role="img" aria-labelledby="t d"><title id="t">One reference, your launch film</title><desc id="d">Illustrated example: find a film, write its reveal and timing in Motion MD, then adapt it to your brand with Codex.</desc>
<rect width="1176" height="332" rx="18" fill="#edf0e8"/><g font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif">
<text x="28" y="39" fill="#486044" font-size="15" font-weight="650" >openmotion  /  FIELD GUIDE</text>
<text x="1148" y="39" fill="#52654e" font-size="14" font-weight="500" text-anchor="end">ILLUSTRATED WORKFLOW   •   01—03</text>
<rect x="28" y="65" width="360" height="240" rx="12" fill="#ffffff"/>
<text x="48" y="97" fill="#55714e" font-size="14" font-weight="650" >01   /   COLLECTIONS</text>
<text x="48" y="135" fill="#203022" font-size="25" font-weight="700" >Find a reference</text>
<rect x="48" y="153" width="320" height="91" rx="6" fill="#e8eee6"/>
<path d="M242 153h126v91H191Z" fill="#a8cf98"/>
<path d="M239 230l27-32 25 13 41-46" stroke="#2a462b" stroke-width="3" fill="none"/>
<text x="60" y="177" fill="#2a462b" font-size="11" font-weight="600" >EXAMPLE FRAME</text>
<text x="60" y="219" fill="#2a462b" font-size="32" font-weight="700" >Orbit</text>
<text x="48" y="281" fill="#52624e" font-size="16" font-weight="400" >Find an opening worth borrowing.</text>
<rect x="408" y="65" width="360" height="240" rx="12" fill="#213328"/>
<text x="428" y="97" fill="#c2dfa9" font-size="14" font-weight="650" >02   /   STYLE SPEC</text>
<text x="428" y="135" fill="#ffffff" font-size="25" font-weight="700" >Write the Motion MD</text>
<path d="M433 163v79" stroke="#8fb880" stroke-width="2"/>
<circle cx="433" cy="169" r="4" fill="#bdde9e"/>
<text x="449" y="174" fill="#badaac" font-size="16" font-weight="600" >00s</text>
<text x="505" y="174" fill="#ffffff" font-size="16" font-weight="500" >Open with the headline</text>
<circle cx="433" cy="201" r="4" fill="#bdde9e"/>
<text x="449" y="206" fill="#badaac" font-size="16" font-weight="600" >03s</text>
<text x="505" y="206" fill="#ffffff" font-size="16" font-weight="500" >Reveal the product</text>
<circle cx="433" cy="233" r="4" fill="#bdde9e"/>
<text x="449" y="238" fill="#badaac" font-size="16" font-weight="600" >08s</text>
<text x="505" y="238" fill="#ffffff" font-size="16" font-weight="500" >Show it in use</text>
<text x="428" y="281" fill="#d1dfca" font-size="16" font-weight="400" >Describe what stays and what changes.</text>
<rect x="788" y="65" width="360" height="240" rx="12" fill="#ffffff"/>
<text x="808" y="97" fill="#55714e" font-size="14" font-weight="650" >03   /   EDITABLE PROJECT</text>
<text x="808" y="135" fill="#203022" font-size="25" font-weight="700" >Make it yours in Codex</text>
<rect x="808" y="153" width="320" height="91" rx="6" fill="#f5e7db"/>
<path d="M1002 153h126v91H951Z" fill="#f0be9c"/>
<path d="M999 230l27-32 25 13 41-46" stroke="#573b33" stroke-width="3" fill="none"/>
<text x="820" y="177" fill="#573b33" font-size="11" font-weight="600" >EXAMPLE FRAME</text>
<text x="820" y="219" fill="#573b33" font-size="32" font-weight="700" >Nova</text>
<text x="808" y="281" fill="#52624e" font-size="16" font-weight="400" >New brand. Same reveal. Editable source.</text>
</g></svg>

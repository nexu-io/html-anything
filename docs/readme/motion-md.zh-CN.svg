<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
<title id="title">Motion MD：让创作决定随风格复用</title>
<desc id="desc">示意图：参考片与品牌资产写入 Motion MD 草案。Agent 阅读后制作可编辑的工程与成片。目前没有自动导入工具。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#5f7452" stroke-width="1.5"/></marker></defs>
<rect width="1440" height="650" rx="22" fill="#f0f1e9"/>
<g font-family="Arial,Helvetica,PingFang SC,Microsoft YaHei,sans-serif">
 <text x="54" y="64" font-size="15" fill="#526449" letter-spacing="2">认识 MOTION MD</text>
 <text x="54" y="114" font-size="39" fill="#202b1c" font-weight="700" letter-spacing="-1">把视频的创作决定写下来，下一支片子就能沿用。</text>
 <text x="54" y="152" font-size="20" fill="#5d6857">人可以读，Agent 可以据此创作，也可以在不同视频之间复用。</text>
 <rect x="54" y="210" width="306" height="144" rx="14" fill="#fff" stroke="#cbd2c3"/>
 <text x="79" y="248" font-size="14" fill="#67775b">01 / 选择参考片</text>
 <text x="79" y="290" font-size="25" fill="#293624" font-weight="700">值得借鉴的风格</text>
 <text x="79" y="323" font-size="17" fill="#67775b">出处 · 作者 · 视觉意图</text>
 <rect x="54" y="374" width="306" height="144" rx="14" fill="#fff" stroke="#cbd2c3"/>
 <text x="79" y="412" font-size="14" fill="#67775b">02 / 带上品牌资产</text>
 <text x="79" y="454" font-size="25" fill="#293624" font-weight="700">自己的产品素材</text>
 <text x="79" y="487" font-size="17" fill="#67775b">标志 · 截图 · 文案 · 素材</text>
 <path d="M372 282h37v77h53M372 446h37v-77h53" fill="none" stroke="#7c8a70" stroke-width="2" marker-end="url(#arrow)"/>
 <rect x="478" y="210" width="443" height="308" rx="16" fill="#23351d"/>
 <text x="506" y="254" font-size="29" fill="#ebf5e4" font-weight="700">MOTION.md</text>
 <rect x="775" y="229" width="117" height="31" rx="15" fill="#3f5537"/><text x="794" y="250" font-size="13" fill="#d0e9c1">草案 v0.1</text>
 <text x="506" y="288" font-size="17" fill="#b6cbaa">一份可阅读的创作规范</text>
 <g font-size="18" fill="#e0ead8">
  <rect x="506" y="312" width="178" height="48" rx="7" fill="#354a2d"/><text x="523" y="343">品牌与资产</text>
  <rect x="698" y="312" width="194" height="48" rx="7" fill="#354a2d"/><text x="715" y="343">叙事与结构</text>
  <rect x="506" y="372" width="178" height="48" rx="7" fill="#354a2d"/><text x="523" y="403">时间与节奏</text>
  <rect x="698" y="372" width="194" height="48" rx="7" fill="#354a2d"/><text x="715" y="403">动效与媒体</text>
  <rect x="506" y="432" width="178" height="48" rx="7" fill="#354a2d"/><text x="523" y="463">可修改项</text>
  <rect x="698" y="432" width="194" height="48" rx="7" fill="#354a2d"/><text x="715" y="463">验收与依据</text>
 </g>
 <path d="M936 364h85" fill="none" stroke="#7c8a70" stroke-width="2" marker-end="url(#arrow)"/>
 <text x="979" y="344" font-size="13" fill="#657659" text-anchor="middle">Agent 阅读</text>
 <rect x="1038" y="210" width="348" height="308" rx="16" fill="#d8efc9" stroke="#b7d5a2"/>
 <text x="1065" y="251" font-size="14" fill="#526b42">03 / 做成自己的视频</text>
 <text x="1065" y="298" font-size="28" font-weight="700" fill="#23351d">可继续编辑的工程。</text>
 <text x="1065" y="334" font-size="28" font-weight="700" fill="#23351d">可分享的成片。</text>
 <path d="M1065 360h294" stroke="#afca9d"/>
 <text x="1065" y="397" font-size="18" fill="#455d37">在 Codex 中创作与修改</text>
 <text x="1065" y="433" font-size="18" fill="#455d37">可视化预览与编辑</text>
 <text x="1065" y="469" font-size="18" fill="#455d37">导出 MP4</text>
 <path d="M54 559h1332" stroke="#cbd2c3"/>
 <text x="54" y="601" font-size="17" fill="#657259">规范草案 · 使用时请明确交给 Agent 阅读 · 渲染以原生工程文件为准</text>
</g>
</svg>

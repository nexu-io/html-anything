<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="846" viewBox="0 0 1280 846" role="img" aria-labelledby="title desc">
<title id="title">Identity + motion, written down.</title>
<desc id="desc">BRANDKIT.md defines identity, message and approved material. MOTION_DESIGN.md defines story, movement, timing and review rules. SKILL.md guides the agent. Source, assets, presets and evidence make the creative package reusable. These files are explicit agent context, not automatic importers.</desc>
<defs>

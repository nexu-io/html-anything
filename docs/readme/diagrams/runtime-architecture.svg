<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
<title id="title">One project. Connected capabilities.</title>
<desc id="desc">Your local agent connects through nine MCP project tools, and Studio connects through local HTTP. The local application manages projects, media, revisions and exports. The Model Gateway generates assets with your accounts; adoption adds them to source. Rendering uses a fixed snapshot. Credentials remain outside video projects.</desc>

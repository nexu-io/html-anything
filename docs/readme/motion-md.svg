 <text x="79" y="323" font-size="17" fill="#67775b">Source · creator · visual intent</text>
 <rect x="54" y="374" width="306" height="144" rx="14" fill="#fff" stroke="#cbd2c3"/>
 <text x="79" y="412" font-size="14" fill="#67775b">02 / BRING YOUR BRAND</text>
 <text x="79" y="454" font-size="25" fill="#293624" font-weight="700">Your product context</text>
 <text x="79" y="487" font-size="17" fill="#67775b">Logo · screens · copy · assets</text>

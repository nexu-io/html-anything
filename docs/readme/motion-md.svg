<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
<title id="title">Motion MD — the creative decisions travel with the style</title>
<desc id="desc">Concept diagram: reference video and your brand feed a Motion MD draft. An Agent reads the document to produce an editable project and a rendered video. The format has no automatic importer yet.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#5f7452" stroke-width="1.5"/></marker></defs>
<rect width="1440" height="650" rx="22" fill="#f0f1e9"/>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="54" y="64" font-size="15" fill="#526449" letter-spacing="2">INTRODUCING MOTION MD</text>
 <text x="54" y="114" font-size="39" fill="#202b1c" font-weight="700" letter-spacing="-1">The creative decisions travel with the style.</text>
 <text x="54" y="152" font-size="20" fill="#5d6857">Readable by you. Usable as context for your Agent. Reusable across videos.</text>
 <rect x="54" y="210" width="306" height="144" rx="14" fill="#fff" stroke="#cbd2c3"/>

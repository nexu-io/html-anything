name: odsuite source checks
on:
  pull_request:
    branches: [refactor/odsuite]
  push:
    branches: [refactor/odsuite]
permissions:
  contents: read
concurrency:
  group: odsuite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: node:24.18.0-bookworm-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
      options: --init
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates procps
      - uses: actions/checkout@v6.0.2
      - run: npm install --global pnpm@11.13.0
      - run: pnpm install --frozen-lockfile --store-dir node_modules/.pnpm-store
      - run: pnpm --filter @open-motion/web exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
      - run: pnpm build
      - run: pnpm -r --workspace-concurrency=1 --if-present run test
      - run: pnpm lint
      - run: pnpm exec biome check .
      - run: pnpm exec odsuite guard

name: Approved Motion installation guide upload

# Temporary delivery of the exact instructions authorized for this test candidate.
on:
  push:
    branches: [codex/motion-npm-test-package-20261109]

permissions:
  contents: read

concurrency:
  group: motion-install-guide-test
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      github.repository == 'nexu-io/html-anything' && github.event.head_commit.message == 'chore: upload approved Motion installation guide'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: b676970f47df7fa2e53c951cae4ca1943290f334
      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
      - name: Write the approved installation instructions
        run: |
          mkdir -p "$RUNNER_TEMP/motion-install-guide-once"
          cat > "$RUNNER_TEMP/motion-install-guide-once/install.md" <<'MOTION_GUIDE_MD'
          # Install OpenMotion 0.6.4-test.4

          This guide pins the complete npm application `@open-design/motion@0.6.4-test.4` on the **test** software channel. It includes MCP, the built Studio and five Skills. The default template environment is **prod**; a software test version does not select DEV templates.

          ## Instructions for the Agent

          1. Check the user's OS/CPU, Node.js and npm, and selected Agent. Node.js 22.18+ with npm and the Agent must already be installed. Supported native targets: darwin/arm64 (26.0+), win32/x64 (Windows 11+). Do not claim support for another target from package-download success.
          2. Use the current host if it is supported; otherwise ask the user to select one. Setup supports `codex`, `claude`, `deepseek` and `workbuddy`. Configure only that host. Preserve existing projects, credentials and unrelated MCP/Skills settings.
          3. For a test candidate, use a separate host profile, application home, project data and Skills directory. Keep those paths and reuse them for prepare and future reconnects. The [platform installation recipes](https://github.com/nexu-io/html-anything/blob/b676970f47df7fa2e53c951cae4ca1943290f334/docs/npm-installation.md) describe the actual supported options. Do not run a test candidate into the user's daily profile by default.
          4. Install the exact package version below, run prepare, then refresh that host to discover the new installation or changed Tools/Skills. Compatible phase-one updates can keep their existing connections; reconnect closed or incompatible transports. Confirm the application version, template environment, eleven public Tools and five Skills. A registration entry alone does not prove the host has loaded them.
          5. Report the result and any failed step. Introduce the available capabilities and wait for the user's next request. Installation does not authorize generating a video or calling a paid model.

          For a normal Codex installation, the command shape is:

          ```sh
          npx --yes --package "@open-design/motion@0.6.4-test.4" openmotion setup --host codex
          npx --yes --package "@open-design/motion@0.6.4-test.4" openmotion prepare
          ```

          For test installations, add the isolated paths/profile from step 3 before executing. For another supported host, use its setup `--host` value and documented profile settings. Setup installs the selected host's MCP and Skills; a second installer or application/manifest download is unnecessary.

          ## Runtime and environment

          Setup copies the checked application into a managed writable directory and installs its locked production npm dependencies. The application and user projects do not run from the temporary npx cache. FFmpeg, ffprobe and the browser are downloaded and verified by prepare or first native use; this is not an offline package.

          There is no persisted switch-environment command in this version. Internal DEV testing uses its separately configured installation; merely setting an environment variable while running setup does not configure a later desktop Agent. Do not silently fall back from one environment to another.

          ## Upgrade, recovery and feedback

          Pin this exact version when reproducing an issue. Before an upgrade, back up project data and preserve the same installation/data paths. Compatible phase-one updates retain existing connections and active exports. For an incompatible protocol, finish active exports before updating only this installation's connection and idle backend together; reconnect after setup/prepare. Refresh host discovery for new Tools or Skills, and preserve unrelated settings. Older applications may not read newer data formats: compatible reinstall or backup restoration requires separate verification. Moving a server-side default does not downgrade installed clients.

          Include the exact version, OS/CPU, Node/Agent versions, template environment, project/revision, reproduction and redacted logs in a report. Installation, real Agent creation, technical MP4 export and human audiovisual acceptance are separate results.

          Release identity: source `b676970f47df7fa2e53c951cae4ca1943290f334`; npm tgz SHA256 `dd88239cc22d2c39c6387f69267d80d63072bcd1dce3bdda4e72571b81069bc1`. [Source and installation details](https://github.com/nexu-io/html-anything/blob/b676970f47df7fa2e53c951cae4ca1943290f334/docs/npm-installation.md).
          MOTION_GUIDE_MD
          cat > "$RUNNER_TEMP/motion-install-guide-once/install-record.json" <<'MOTION_GUIDE_RECORD'
          {
            "schemaVersion": 1,
            "candidate": false,
            "packageName": "@open-design/motion",
            "version": "0.6.4-test.4",
            "packageSpec": "@open-design/motion@0.6.4-test.4",
            "channel": "test",
            "templateEnvironment": "prod",
            "commit": "b676970f47df7fa2e53c951cae4ca1943290f334",
            "tgzSHA256": "dd88239cc22d2c39c6387f69267d80d63072bcd1dce3bdda4e72571b81069bc1",
            "applicationSHA256": "316ad993959a16618a237f952bc5b0879100f4304a181a7e007567eebfaf4e96",
            "locks": {
              "npm": "99b864bd1c8edca5c9a14359e4b980f34458f29521cda4d6369d6531bb90ec45",
              "native": "892812b82adcc5368637cb452855a479412b7efa99874f54da952cec2cac9638"
            },
            "guideSHA256": "04fbce5859dc3178a64536e868c8bef782c673768f7630d0e9d88366935b97b6"
          }
          MOTION_GUIDE_RECORD
      - name: Upload and verify the versioned and test-channel instructions
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_MAX_ATTEMPTS: '3'
          AWS_PAGER: ''
          MOTION_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_RELEASES_URL }}
          MOTION_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_RELEASES_BUCKET }}
          MOTION_INSTALL_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
        run: |
          if [ "$MOTION_R2_BUCKET" != 'open-design-releases' ] || [ "${MOTION_INSTALL_PUBLIC_ORIGIN%/}" != 'https://releases.open-design.ai' ]; then echo 'The destination differs from the approved release bucket/origin.' >&2; exit 1; fi
          aws --version
          node .github/scripts/publish-install-guide.mjs "$RUNNER_TEMP/motion-install-guide-once"
      - name: Retain a public-safe upload receipt
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,existsSync} from 'node:fs';
          const dir=process.env.RUNNER_TEMP+'/motion-install-guide-once';
          if (existsSync(dir+'/publication.json')) {
            const state=JSON.parse(readFileSync(dir+'/publication.json'));
            delete state.endpoint;
            writeFileSync(dir+'/upload-receipt.json',JSON.stringify(state,null,2)+'\n');
          }
          JS
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: motion-install-guide-upload-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/motion-install-guide-once/install.md
            ${{ runner.temp }}/motion-install-guide-once/install-record.json
            ${{ runner.temp }}/motion-install-guide-once/previous-install.md
            ${{ runner.temp }}/motion-install-guide-once/upload-receipt.json
          retention-days: 30
          if-no-files-found: warn

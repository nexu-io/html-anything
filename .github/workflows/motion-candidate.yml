name: Motion candidate build
run-name: Motion candidate · ${{ inputs.channel || 'test' }} · ${{ inputs.version || 'auto' }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'test builds DEV prereleases; stable builds prod with an explicit stable version'
        type: choice
        options: [test, stable]
        default: test
      version:
        description: 'test: optional short version override; stable: required MAJOR.MINOR.PATCH; build only'
        type: string
        required: false
        default: ''
      source_sha:
        description: 'Optional reviewed full SHA integrated into main; empty freezes the selected dispatch commit'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  candidate:
    name: Build immutable candidate
    if: github.repository == 'nexu-io/openmotion'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MOTION_RELEASE_CHANNEL: ${{ inputs.channel || 'test' }}
      MOTION_TEMPLATE_ENVIRONMENT: ${{ inputs.channel == 'stable' && 'prod' || 'dev' }}
      MOTION_SOURCE_SHA: ${{ inputs.source_sha }}
      MOTION_VERSION: ${{ inputs.version }}
      OPENMOTION_TELEMETRY: '0'
      HYPERFRAMES_BROWSER_PATH: /usr/bin/google-chrome
      HYPERFRAMES_FFMPEG_PATH: /usr/bin/ffmpeg
      HYPERFRAMES_FFPROBE_PATH: /usr/bin/ffprobe
    steps:
      - name: Require Motion integration branch
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::Select main in Run workflow for Motion operations.'
            exit 1
          fi
      - uses: actions/checkout@v6.0.2
        with:
          path: control
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
      - name: Resolve and freeze the integrated source
        id: source
        run: |
          git -C control fetch origin main:refs/remotes/origin/main
          node control/.github/scripts/motion-release.mjs source control
      - uses: actions/checkout@v6.0.2
        with:
          path: source
          ref: ${{ steps.source.outputs.source_sha }}
          persist-credentials: false
      - name: Scan tracked source before dependency installation
        run: |
          node control/.github/scripts/motion-scan.mjs install "$RUNNER_TEMP/scanner"
          node control/.github/scripts/motion-scan.mjs source source "$RUNNER_TEMP/source-scan.json" "$RUNNER_TEMP/scanner/gitleaks"
      - name: Restore rendering package downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/motion-rendering-apt/*.deb
          # Cache entries are immutable, so save under a per-run key and restore the newest entry by prefix.
          key: rendering-apt-ubuntu24.04-${{ runner.arch }}-zip-unzip-ffmpeg-fonts-noto-core-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rendering-apt-ubuntu24.04-${{ runner.arch }}-zip-unzip-ffmpeg-fonts-noto-core-
      - name: Install rendering test tools
        run: |
          # The hosted Ubuntu image provides Chrome; avoid Ubuntu's desktop Chromium snap.
          "$HYPERFRAMES_BROWSER_PATH" --version
          missing=()
          for package in zip unzip ffmpeg fonts-noto-core; do
            if [ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null)" != 'install ok installed' ]; then
              missing+=("$package")
            fi
          done
          if ((${#missing[@]})); then
            mkdir -p "$RUNNER_TEMP/motion-rendering-apt/partial"
            apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
              -o "Dir::Cache::archives=$RUNNER_TEMP/motion-rendering-apt" -o APT::Keep-Downloaded-Packages=true)
            # Hosted runners already have package indexes. Refresh only if installation needs it.
            if ! sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"; then
              sudo apt-get "${apt_options[@]}" update
              sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"
            fi
            du -sh "$RUNNER_TEMP/motion-rendering-apt/"*.deb
          fi
      - name: Check the selected source
        working-directory: source
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run typecheck:studio
          npm run build:studio
          npm run build:tracking
          node --experimental-strip-types --test tests/tracking.test.ts tests/install.test.ts tests/npm-installer.test.ts tests/native-runtime.test.ts tests/npm-package.test.ts tests/test-package.test.ts tests/source-install.test.ts tests/bootstrap.test.ts tests/mcp-registry.test.ts tests/mcp-runtime.test.ts tests/mcp-upgrade.test.ts tests/preview.test.ts tests/phase1.test.ts tests/preview-handoff.test.ts tests/adapters.test.ts tests/package.test.ts tests/recreate-measure.test.ts tests/workflow.test.ts tests/catalog.test.ts tests/prism-templates.test.ts tests/extension-boundary.test.ts tests/connections.test.ts tests/install-guide.test.ts
          npm run test:studio -- --maxWorkers=2
          npm run package:phase1
          archive="$PWD/dist/openmotion-$(node -p "require('./package.json').version")-phase1.zip"
          node tests/phase1-package.mjs "$archive" "$RUNNER_TEMP/phase1-e2e"
      - name: Build the final application tgz once and scan both archives
        env:
          MOTION_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          MOTION_VERSION: ${{ steps.source.outputs.version }}
        run: |
          node source/scripts/package-npm.mjs "$RUNNER_TEMP/build" "$MOTION_VERSION" --template-env="$MOTION_TEMPLATE_ENVIRONMENT"
          cp "$RUNNER_TEMP/source-scan.json" "$RUNNER_TEMP/build/source-scan.json"
          node control/.github/scripts/motion-scan.mjs package "$RUNNER_TEMP/build/openmotion-app-$MOTION_VERSION.tgz" "$RUNNER_TEMP/build/package-scan.json" "$RUNNER_TEMP/scanner/gitleaks"
          node control/.github/scripts/motion-release.mjs seal "$RUNNER_TEMP/build" "$RUNNER_TEMP/candidate" source
      - name: Retain the immutable candidate
        id: artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: motion-candidate-${{ steps.source.outputs.version }}
          path: ${{ runner.temp }}/candidate/
          retention-days: 30
          if-no-files-found: error
      - name: Show candidate download and tester instructions
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const c = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/candidate/candidate.json'));
          const run = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Candidate ready for acceptance\n\nVersion: ${c.version}\n\nSource: ${c.sourceCommit}\n\nTGZ SHA256: ${c.tgzSHA256}\n\n[Download motion-candidate-${c.version}](${run}#artifacts), extract it and give the folder to your Agent with this instruction:\n\n> Follow candidate-install.md in this folder to install this exact local candidate into an isolated test profile, application home, project data and Skills directory. Verify host loading without waiting for background video-component preparation. Run prepare only when explicitly asked to wait or before requested media/capture/export acceptance checks. Record actual results in a private copy of acceptance.md; mark unrun checks NOT RUN. Do not publish.\n\nUse candidate-install.md before publication, not the sibling registry install.md. To publish, manually open Motion npm publication, select the same channel and enter ${c.version}; no acceptance checkbox is required. Nothing was published by this build.\n`);
          JS

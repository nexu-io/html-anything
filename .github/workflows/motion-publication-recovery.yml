name: Motion snapshot recovery

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel of the existing version; snapshots only, no tag or default-guide changes'
        type: choice
        options: [test, stable]
        default: test
      version:
        description: 'Exact existing candidate version; the identical package must already be public on npm'
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  select-ref:
    if: github.repository == 'nexu-io/html-anything'
    runs-on: ubuntu-24.04
    steps:
      - name: Require Motion integration branch
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/feature/motion' ]; then
            echo '::error::Select feature/motion in Run workflow for Motion operations.'
            exit 1
          fi
  recover:
    needs: select-ref
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/motion-publish-test.yml
    with:
      channel: ${{ inputs.channel || 'test' }}
      version: ${{ inputs.version }}
      archive_only: true
    secrets: inherit
